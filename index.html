<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>226 · Buques &amp; Fam'ss</title>
  <link rel="icon" type="image/svg+xml" href="./Amtradszaloeil.svg">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="./Amtradszaloeil.svg" alt="226" class="brand-logo">
      <span class="brand-title">226</span>
    </div>

    <nav class="nav-tabs" role="tablist" aria-label="Modes">
      <button type="button" class="nav-tab is-active" data-tab="flashcards" role="tab" aria-selected="true">Cartes</button>
      <button type="button" class="nav-tab" data-tab="match" role="tab" aria-selected="false">Match</button>
      <button type="button" class="nav-tab" data-tab="quiz" role="tab" aria-selected="false">Quiz</button>
      <button type="button" class="nav-tab" data-tab="leaderboard" role="tab" aria-selected="false">Classement</button>
    </nav>

    <button type="button" id="auth-btn" class="auth-pill">Connexion</button>
  </header>

  <main class="main-wrap">
    <section id="view-flashcards" class="view is-active" role="tabpanel"></section>
    <section id="view-match" class="view" role="tabpanel" hidden></section>
    <section id="view-quiz" class="view" role="tabpanel" hidden></section>
    <section id="view-leaderboard" class="view" role="tabpanel" hidden></section>
  </main>

  <div id="auth-modal" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
      <img src="./Amtradszaloeil.svg" alt="226" id="auth-gate-logo" class="auth-gate-logo" hidden>
      <div class="modal-head">
        <h2 id="auth-modal-title" class="modal-title">Connexion</h2>
        <button type="button" id="auth-close" class="icon-btn" aria-label="Fermer">✕</button>
      </div>
      <form id="auth-form" class="modal-form">
        <label class="field">
          <span>Buque</span>
          <input type="text" id="auth-buque" list="buques-list" autocomplete="off" required placeholder="Ex : KALLISTE">
          <datalist id="buques-list"></datalist>
        </label>
        <label class="field">
          <span>Fam'ss</span>
          <input type="text" id="auth-famss" autocomplete="off" required placeholder="Ex : 156">
        </label>
        <p id="auth-error" class="form-error" hidden></p>
        <div class="modal-actions">
          <button type="button" id="auth-logout" class="btn btn-ghost" hidden>Déconnexion</button>
          <button type="submit" class="btn btn-primary">Valider</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
